<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>You are offline</title>
    <style>
      body { margin:0; min-height:100vh; display:grid; place-items:center; background:#FFFDD0; color:#241A1C;
             font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; padding:24px; }
      .box { max-width:420px; background:#fff; border:1px solid #E8E1D4; border-radius:12px; padding:24px; }
      h1 { font-family: Georgia, serif; font-size:22px; margin:0 0 8px; }
      p { color:#6F6265; line-height:1.5; margin:0 0 16px; }
      a { display:inline-block; min-height:48px; line-height:48px; padding:0 20px; background:#800020; color:#fff;
          text-decoration:none; border-radius:8px; font-weight:600; }
    </style>
  </head>
  <body>
    <div class="box">
      <h1>This screen was not saved for offline use</h1>
      <p>Your tasks, guests and settings are still safe on this phone. Open the app again and it will load from local storage.</p>
      <a href="./">Open the app</a>
    </div>
  </body>
</html>
